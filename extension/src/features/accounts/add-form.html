<div class="card add-card">
  <h3>Ajouter des comptes X à bloquer</h3>
  <form class="add" data-part="form" novalidate>
    <label for="addInput" class="sr-only">Comptes à ajouter</label>
    <input id="addInput" data-part="input" type="text" spellcheck="false" autocomplete="off"
      placeholder="@nom1 @nom2 https://x.com/nom3">
    <button type="submit">Ajouter</button>
  </form>
  <p class="hint">Plusieurs comptes séparés par des espaces, au format @nom, nom ou URL de profil.</p>
  <p class="add-status" data-part="status" role="status" aria-live="polite"></p>
</div>
